[package]
name = "zenss-example-product-echo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[features]
default = ["dynamic_plugin"]
dynamic_plugin = []
# Native product only; the network Client SDK keeps registry Zenoh unchanged.
router-origin = ["zenoh/zenss-router-origin"]

[lib]
name = "zenss_plugin_echo"
crate-type = ["cdylib", "rlib"]

[dependencies]
zenss-plugin-trait.workspace = true
zenoh.workspace = true
serde_json.workspace = true
tokio.workspace = true

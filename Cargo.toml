# Generated public-only workspace; edit the ZenSS source repository.
[workspace]
resolver = "2"
exclude = ["third-party/zenoh", "third-party/zenoh-transport"]
members = ["contracts/zenss-contracts", "crates/zenss-plugin-trait", "sdk/rust/zenss-client-sdk", "sdk/rust/zenss-client-host", "examples/product-echo", "examples/outbound-client"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["ZenSS Team"]
repository = "https://github.com/marcoyohn/zenss-sdk"
license = "Apache-2.0"

[workspace.dependencies]
"anyhow" = { "version" = "=1.0.104" }
"async-trait" = { "version" = "=0.1.92" }
"futures-util" = { "version" = "=0.3.34" }
"serde" = { "version" = "=1.0.229", "features" = ["derive"] }
"serde_json" = { "version" = "=1.0.151" }
"sha2" = { "version" = "=0.10.9" }
"thiserror" = { "version" = "=2.0.21" }
"tokio" = { "version" = "=1.53.1", "features" = ["full"] }
"tokio-util" = { "version" = "=0.7.19", "features" = ["rt"] }
"tracing" = { "version" = "=0.1.44" }
"tracing-subscriber" = { "version" = "=0.3.23", "features" = ["env-filter"] }
"zenoh" = { "path" = "third-party/zenoh", "version" = "=1.10.1", "default-features" = false, "features" = ["unstable", "transport_tcp", "transport_tls", "auth_pubkey", "zenss-route-gate"] }
"zenoh-plugin-trait" = { "version" = "=1.10.1" }
"zenoh-result" = { "version" = "=1.10.1" }
"zenoh-util" = { "version" = "=1.10.1" }
"zenss-client-host" = { "path" = "sdk/rust/zenss-client-host", "version" = "0.6.0" }
"zenss-client-sdk" = { "path" = "sdk/rust/zenss-client-sdk", "version" = "0.6.0" }
"zenss-contracts" = { "path" = "contracts/zenss-contracts", "version" = "0.6.0" }
"zenss-plugin-trait" = { "path" = "crates/zenss-plugin-trait" }

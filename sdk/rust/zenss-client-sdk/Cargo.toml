[package]
name = "zenss-client-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Explicit outbound or hosted ZenSS client; no private host dependencies"

[features]
default = []
plaintext = ["zenoh/auth_pubkey", "dep:rsa", "dep:rand"]
test-support = []

[dependencies]
async-trait.workspace = true
zenoh = { version = "=1.10.1", default-features = false, features = ["unstable", "transport_tcp", "transport_tls"] }
zenss-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true

base64 = "0.22"
metrics = "0.24"
futures-util.workspace = true
thiserror.workspace = true
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "ring", "pem"] }
sha2 = "0.10"
rsa = { version = "0.9", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
